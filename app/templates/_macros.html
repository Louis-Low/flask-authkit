{% macro field(control, password=False) %}<div class="field">{{ control.label }}{% if password %}<div class="password-wrap">{{ control(autocomplete='current-password' if control.name == 'password' else 'new-password') }}<button type="button" class="toggle-password" aria-label="Show password">Show</button></div>{% else %}{{ control() }}{% endif %}{% for error in control.errors %}<p class="error">{{ error }}</p>{% endfor %}</div>{% endmacro %}
