<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Flask AuthKit authentication starter"><title>{% block title %}Flask AuthKit{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}"></head><body><header class="site-header"><a class="brand" href="{{ url_for('main.index') }}"><span class="brand-mark">A</span> AuthKit</a><nav>{% if current_user.is_authenticated %}<a href="{{ url_for('main.profile') }}">Profile</a><a href="{{ url_for('auth.logout') }}">Sign out</a>{% else %}<a href="{{ url_for('auth.login') }}">Sign in</a><a class="nav-cta" href="{{ url_for('auth.register') }}">Get started</a>{% endif %}</nav></header><main class="container">{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}" role="status">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
